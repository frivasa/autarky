[main]
font=Iosevka Nerd Font:size=14
pad=20x20

include=~/.config/autarky/current/theme/foot_colors.ini

[environment]
TERM=foot


[scrollback]
lines=100000
multiplier=2.0
# indicator-position=relative
# indicator-format=""

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
style=dotted
osc8-underline=url-mode

[cursor]
beam-thickness=1.5

[mouse]
hide-when-typing = yes
# convert scroll into up/downs in "alt screen" (?)
alternate-scroll-mode=yes

## Misc colors
