force-window=yes
autofit=800x600
keepaspect-window=no
volume=80
idle=yes
keep-open=yes

# front load files to avoid external read problems
cache=yes
demuxer-max-bytes=8GiB
demuxer-max-back-bytes=4GiB
demuxer-cache-wait=yes

hwdec=nvdec
gpu-api=opengl
include="~/.config/autarky/current/theme/mpv.osdcolor.conf"
