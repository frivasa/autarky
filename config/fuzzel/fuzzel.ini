include=~/.config/autarky/current/theme/fuzzel_colors.ini
font = Iosevka NF:size=15
use-bold = yes

terminal = footclient

prompt = ""
message = "App Search"

icons-enabled = yes
# icon-theme = Gruvbox-Plus-Dark
icon-theme = yet-another-monochrome-icon-set

sort-result = yes
match-counter = yes

# show derived options from the apps (like open file manager at a bookmark)
show-actions = no
list-executables-in-path = no

horizontal-pad = 30
vertical-pad = 10
line-height = 30
# prompt to options distance
inner-pad = 40

# hide search prompt (searching still works)
hide-prompt = yes
# search prompt text
placeholder = "    search"

# shorten ad-hoc to number of options
minimal-lines = yes

# 1 to disable big image when closing in on target
image-size-ratio = 0.3
anchor= "top-left"
x-margin = 50
y-margin = 300

render-workers = 1
match-workers = 1

[border]
width = 4
radius = 10
selection-radius = 8


